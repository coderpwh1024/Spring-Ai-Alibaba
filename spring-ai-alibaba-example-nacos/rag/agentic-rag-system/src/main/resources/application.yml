server:
  port: 8089

spring:
  application:
    name: agentic-rag-system
  
  datasource:
    url: jdbc:mysql://localhost:3306/agentic_rag?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      jedis:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: -1ms

# Azure OpenAI Configuration
azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
    api-key: ${AZURE_OPENAI_API_KEY:your-api-key}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4}
    api-version: ${AZURE_OPENAI_API_VERSION:2024-02-15-preview}

# Elasticsearch Configuration
elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
  username: ${ELASTICSEARCH_USERNAME:}
  password: ${ELASTICSEARCH_PASSWORD:}
  ssl: ${ELASTICSEARCH_SSL:false}
  index:
    documents: rag_documents
    conversations: rag_conversations

# RAG Configuration
rag:
  chunk-size: 1000
  chunk-overlap: 200
  max-results: 10
  similarity-threshold: 0.7
  
# Agentic Configuration
agentic:
  max-iterations: 5
  tools:
    - name: search
      description: Search through document knowledge base
    - name: calculate
      description: Perform mathematical calculations
    - name: summarize
      description: Summarize text content

# Logging Configuration
logging:
  level:
    com.example.rag: DEBUG
    org.springframework.data.elasticsearch: DEBUG
    co.elastic.clients: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always