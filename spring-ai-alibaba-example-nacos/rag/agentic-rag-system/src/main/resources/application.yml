server:
  port: 8089

spring:
  application:
    name: agentic-rag-system
  
  datasource:
    url: jdbc:mysql://localhost:3306/agentic_rag?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      jedis:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: -1ms

# Azure OpenAI Configuration
azure:
  openai:
    endpoint:
    api-key:
    deployment-name:
    api-version: 2024-08-01-preview

# Elasticsearch Configuration
elasticsearch:
  host: 127.0.0.1
  port: 9200
  username:
  password:
  ssl: false
  index:
    documents: rag_documents
    conversations: rag_conversations

# RAG Configuration
rag:
  chunk-size: 1000
  chunk-overlap: 200
  max-results: 10
  similarity-threshold: 0.7

# Agentic Configuration
agentic:
  max-iterations: 5
  tools:
    - name: search
      description: Search through document knowledge base
    - name: calculate
      description: Perform mathematical calculations
    - name: summarize
      description: Summarize text content

# Logging Configuration
logging:
  level:
    com.example.rag: DEBUG
    org.springframework.data.elasticsearch: DEBUG
    co.elastic.clients: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always