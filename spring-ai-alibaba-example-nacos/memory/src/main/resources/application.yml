server:
  port: 9006



spring:
  application:
    name: memory
  elasticsearch:
    uris: http://127.0.0.1:9200
    username:
    password:
  ai:
    azure:
      openai:
        api-key: ""
        endpoint: ""
        chat:
          options:
            deployment-name: ""
        embedding:
          enabled: true
          metadata-mode: embed
          options:
            model: "text-embedding-ada-002"
            deployment-name: "Server"
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: chat_memory_index
        similarity: cosine
        dimensions: 1536
        batching-strategy: TOKEN_COUNT


