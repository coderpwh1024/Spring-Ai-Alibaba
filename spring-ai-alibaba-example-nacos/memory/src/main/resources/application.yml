server:
  port: 9006



spring:
  application:
    name: memory
  elasticsearch:
    uris: http://127.0.0.1:9200

  ai:
    vectorstore:
      elasticsearch:
        index-name: chat_memory_index
        similarity: cosine
        dimensions: 1536
        batching-strategy: TOKEN_COUNT
    azure:
      openai:
        api-key: ""
        endpoint: ""
        chat:
          options:
            deployment-name: "Server"

